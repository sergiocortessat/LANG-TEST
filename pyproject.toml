[project]
name = "LANG-TEST"
version = "0.1.0"
description = "Staged lab: LangChain, LangGraph, MCP, and LangSmith via a small Invoice Assistant"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.5.2",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "mypy>=2.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
files = "src"
exclude = "(venv|\\.venv)"

# ---------------------------------------------------------------------------
# Optional uv scripts (like npm run). Uncomment [tool.uv.scripts] to use them
# instead of — or alongside — the Makefile. Run from repo root:
#   uv run dev
#   uv run test
#   uv run mypy
# Install deps has no script; use:  uv sync --all-groups  (same as make sync)
